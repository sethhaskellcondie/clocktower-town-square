<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="38%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#4a3f68"/>
      <stop offset="55%" stop-color="#352c4e"/>
      <stop offset="100%" stop-color="#15101f"/>
    </radialGradient>
    <radialGradient id="token" cx="38%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#f4eddd"/>
      <stop offset="70%" stop-color="#e9e0cc"/>
      <stop offset="100%" stop-color="#cfc4a8"/>
    </radialGradient>
  </defs>

  <!-- dark purple plaque -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#bg)"/>
  <rect x="2.25" y="2.25" width="59.5" height="59.5" rx="12.75" fill="none"
        stroke="#6e6388" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- ivory life token -->
  <circle cx="32" cy="32" r="25" fill="url(#token)"/>
  <circle cx="32" cy="32" r="25" fill="none" stroke="#3b3247" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- notched rim: dashed tick ring -->
  <circle cx="32" cy="32" r="21.5" fill="none" stroke="#8a7f68" stroke-opacity="0.8"
          stroke-width="3" stroke-dasharray="1.6 2.9"/>

  <!-- engraved inner rings -->
  <circle cx="32" cy="32" r="17.5" fill="none" stroke="#8a7f68" stroke-opacity="0.7" stroke-width="1.2"/>
  <circle cx="32" cy="32" r="15.5" fill="none" stroke="#8a7f68" stroke-opacity="0.45" stroke-width="0.8"/>

  <!-- clock hands at midnight-ish -->
  <g stroke="#3b3247" stroke-linecap="round">
    <line x1="32" y1="32" x2="32" y2="20" stroke-width="3"/>
    <line x1="32" y1="32" x2="40.5" y2="36.5" stroke-width="2.2"/>
  </g>
  <circle cx="32" cy="32" r="2.4" fill="#3b3247"/>

  <!-- blood drop -->
  <path d="M45.5 38.2 C47.9 42.1 49.4 44.5 49.4 46.6 A3.9 3.9 0 0 1 41.6 46.6 C41.6 44.5 43.1 42.1 45.5 38.2 Z"
        fill="#8e1f26" stroke="#5d1118" stroke-width="0.8"/>
</svg>
