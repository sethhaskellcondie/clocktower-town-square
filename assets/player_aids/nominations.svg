<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1320 560" width="1320" height="560">
  <defs>
    <!-- One raised left hand, palm out (mirrored below to make right hands), wrist at (100,230), arm running off the bottom. -->
    <g id="hand">
      <rect x="56" y="118" width="88" height="112" rx="22"/>
      <path d="M74,222 L126,222 L134,620 L66,620Z"/>
      <path d="M54,300 Q100,290 146,300 L156,620 L44,620Z"/>
      <g fill="none" stroke="#000" stroke-linecap="round">
        <line x1="67" y1="140" x2="57" y2="52" stroke-width="20"/>
        <line x1="92" y1="135" x2="90" y2="32" stroke-width="20"/>
        <line x1="117" y1="137" x2="124" y2="44" stroke-width="20"/>
        <line x1="137" y1="150" x2="152" y2="82" stroke-width="18"/>
        <line x1="66" y1="205" x2="27" y2="146" stroke-width="24"/>
      </g>
    </g>
    <g id="hand-detail" fill="none" stroke="#efe6d6" stroke-linecap="round" stroke-width="3.5">
      <path d="M50,314 Q100,304 150,314"/>
      <path d="M51,330 Q100,320 151,330"/>
      <path d="M72,360 Q76,420 70,470" stroke-width="3"/>
      <path d="M126,366 Q122,410 129,450" stroke-width="3"/>
      <path d="M74,176 Q100,192 128,174" stroke-width="3"/>
      <path d="M64,200 Q80,182 76,156" stroke-width="3"/>
      <path d="M53,98 L62,97 M84,88 L95,88 M116,92 L126,93 M141,113 L150,115" stroke-width="3"/>
    </g>

    <!-- Cream outline with a soft glow, like the character icons. -->
    <filter id="outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="4" result="grown"/>
      <feFlood flood-color="#efe6d6"/>
      <feComposite in2="grown" operator="in" result="edge"/>
      <feGaussianBlur in="grown" stdDeviation="7" result="blur"/>
      <feFlood flood-color="#efe6d6" flood-opacity="0.25"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="edge"/></feMerge>
    </filter>

    <!-- Mottled gold paint, clipped to the hand. -->
    <filter id="paint" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="4" seed="7"/>
      <feColorMatrix type="matrix" values="2.6 0 0 0 -0.8  2.6 0 0 0 -0.8  2.6 0 0 0 -0.8  0 0 0 0 1"/>
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0.30 0.48 0.70 0.80 0.88"/>
        <feFuncG type="table" tableValues="0.18 0.32 0.52 0.62 0.72"/>
        <feFuncB type="table" tableValues="0.04 0.08 0.18 0.26 0.36"/>
      </feComponentTransfer>
      <feComposite in2="SourceAlpha" operator="in"/>
    </filter>

    <clipPath id="panel">
      <rect x="43" y="43" width="1234" height="474" rx="24"/>
    </clipPath>
  </defs>

  <rect width="1320" height="560" fill="#261f45"/>
  <rect x="41.5" y="41.5" width="1237" height="477" rx="26" fill="#14101e" stroke="#d1b56a" stroke-width="3"/>
  <text x="660" y="125" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-weight="bold" font-size="58" fill="#d1b56a">NOMINATIONS</text>

  <g clip-path="url(#panel)">
    <g transform="translate(205 196) rotate(-10 100 230) scale(-0.92 0.92) translate(-200 0)">
      <use xlink:href="#hand" filter="url(#outline)"/>
      <use xlink:href="#hand" filter="url(#paint)"/>
      <use xlink:href="#hand-detail"/>
    </g>
    <g transform="translate(470 168) rotate(-3 100 230) scale(-0.95 0.95) translate(-200 0)">
      <use xlink:href="#hand" filter="url(#outline)"/>
      <use xlink:href="#hand" filter="url(#paint)"/>
      <use xlink:href="#hand-detail"/>
    </g>
    <g transform="translate(715 180) rotate(4 100 230) scale(-0.95 0.95) translate(-200 0)">
      <use xlink:href="#hand" filter="url(#outline)"/>
      <use xlink:href="#hand" filter="url(#paint)"/>
      <use xlink:href="#hand-detail"/>
    </g>
    <g transform="translate(965 204) rotate(11 100 230) scale(-0.9 0.9) translate(-200 0)">
      <use xlink:href="#hand" filter="url(#outline)"/>
      <use xlink:href="#hand" filter="url(#paint)"/>
      <use xlink:href="#hand-detail"/>
    </g>
  </g>
</svg>
