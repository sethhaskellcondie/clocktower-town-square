<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1320 560" width="1320" height="560">
  <defs>
    <!-- One token's shape, centred on (0,0). -->
    <circle id="token" r="56"/>
    <!-- The milled rim and the rings stamped into the face, like the town square's tokens. -->
    <g id="token-detail" fill="none" stroke="#14101e">
      <circle r="49" stroke-width="9" stroke-opacity="0.35" pathLength="120" stroke-dasharray="0.55 1.45"/>
      <circle r="42" stroke-width="2.5" stroke-opacity="0.45"/>
      <circle r="35" stroke-width="1.5" stroke-opacity="0.3"/>
    </g>

    <!-- A light falling from the top left, and a darker bevel round the edge. -->
    <radialGradient id="shine" cx="0.38" cy="0.32" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#000000" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.38"/>
    </radialGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <!-- Cream outline with a soft glow, like the character icons. -->
    <filter id="outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="4" result="grown"/>
      <feFlood flood-color="#efe6d6"/>
      <feComposite in2="grown" operator="in" result="edge"/>
      <feGaussianBlur in="grown" stdDeviation="9" result="blur"/>
      <feFlood flood-color="#efe6d6" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="edge"/></feMerge>
    </filter>

    <!-- Mottled blue paint for the good players, clipped to the token. -->
    <filter id="paint-good" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" seed="5"/>
      <feColorMatrix type="matrix" values="2.6 0 0 0 -0.8  2.6 0 0 0 -0.8  2.6 0 0 0 -0.8  0 0 0 0 1"/>
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0.16 0.24 0.36 0.46 0.56"/>
        <feFuncG type="table" tableValues="0.28 0.40 0.54 0.64 0.72"/>
        <feFuncB type="table" tableValues="0.50 0.63 0.78 0.85 0.90"/>
      </feComponentTransfer>
      <feComposite in2="SourceAlpha" operator="in"/>
    </filter>

    <!-- Mottled red paint for the evil players, clipped to the token. -->
    <filter id="paint-evil" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" seed="9"/>
      <feColorMatrix type="matrix" values="2.6 0 0 0 -0.8  2.6 0 0 0 -0.8  2.6 0 0 0 -0.8  0 0 0 0 1"/>
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0.50 0.63 0.78 0.85 0.90"/>
        <feFuncG type="table" tableValues="0.16 0.24 0.36 0.46 0.56"/>
        <feFuncB type="table" tableValues="0.18 0.26 0.37 0.47 0.56"/>
      </feComponentTransfer>
      <feComposite in2="SourceAlpha" operator="in"/>
    </filter>

    <!-- A token is its base, its team's paint, then its finish. Each seat
         turns the paint by a different amount so no two tokens match. -->
    <g id="base">
      <use xlink:href="#token" transform="translate(0 7)" fill="#000" opacity="0.55" filter="url(#shadow)"/>
      <use xlink:href="#token" filter="url(#outline)"/>
    </g>
    <use id="good" xlink:href="#token" filter="url(#paint-good)"/>
    <use id="evil" xlink:href="#token" filter="url(#paint-evil)"/>
    <g id="finish">
      <use xlink:href="#token" fill="url(#shine)"/>
      <use xlink:href="#token-detail"/>
    </g>
  </defs>

  <rect width="1320" height="560" fill="#261f45"/>
  <rect x="41.5" y="41.5" width="1237" height="477" rx="26" fill="#14101e" stroke="#a59cbd" stroke-width="3"/>
  <text x="660" y="120" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-weight="bold" font-size="58" fill="#a59cbd">TEENSYVILLE</text>

  <!-- The circle the five players sit around. -->
  <circle cx="660" cy="336" r="128" fill="none" stroke="#a59cbd" stroke-width="3" opacity="0.2"/>
  <circle cx="660" cy="336" r="100" fill="none" stroke="#a59cbd" stroke-width="2" opacity="0.1"/>

  <!-- Five seats, 72 degrees apart starting at the top: three good, two evil. -->
  <g transform="translate(660 208)">
    <use xlink:href="#base"/><use xlink:href="#good" transform="rotate(10)"/><use xlink:href="#finish"/>
  </g>
  <g transform="translate(781.7 296.4)">
    <use xlink:href="#base"/><use xlink:href="#evil" transform="rotate(130)"/><use xlink:href="#finish"/>
  </g>
  <g transform="translate(735.2 439.6)">
    <use xlink:href="#base"/><use xlink:href="#good" transform="rotate(250)"/><use xlink:href="#finish"/>
  </g>
  <g transform="translate(584.8 439.6)">
    <use xlink:href="#base"/><use xlink:href="#evil" transform="rotate(-40)"/><use xlink:href="#finish"/>
  </g>
  <g transform="translate(538.3 296.4)">
    <use xlink:href="#base"/><use xlink:href="#good" transform="rotate(170)"/><use xlink:href="#finish"/>
  </g>
</svg>
