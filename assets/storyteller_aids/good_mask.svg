<!-- A smiling comedy mask, tipped as if laughing, for the good team -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    /* How the picture looks on a card, for viewing this file on its own.
       On a card, each shape is painted from the card's own color instead. */
    svg { background: #29616f; }
    path { fill: #9ec3cd; stroke: #cbe0e6; stroke-linecap: round; stroke-linejoin: round; }
    path:not([stroke-width]) { stroke-width: 0.6; }
    .dark { fill: #29616f; stroke: none; }
    .line { fill: none; stroke: #9ec3cd; }
    .line:not([stroke-width]) { stroke-width: 1.5; }
    .dark.line { stroke: #29616f; }
  </style>

  <!-- The mask, its brow dipping between two raised corners and its sides tapering to a round chin -->
  <path class="light" stroke-width="2" d="M12 12.6C19.2 15.5 29.5 17.7 39.8 18.2C43.1 18.3 46.2 18.3 49.1 18.1C62 16.1 73.8 11.2 83.8 5.4C86.8 13.2 88.6 22.9 88.4 32.4C88.3 36.6 87.8 40.5 87.1 44.3C85.4 58.7 80 72.2 71.9 83.3C67.2 89.8 62.2 93.5 56.7 94.3C51 94.6 45.4 91.7 39.7 86.5C29.6 77.3 21.8 65.6 17.4 52.9C15.9 48.5 14.6 44.2 13.8 39.8C12.2 30.7 11.4 21.1 12 12.6Z"/>
  <!-- Brows arched high, each flicking up at its inner end -->
  <path class="dark" d="M21.4 37.5C24.5 30.2 33.3 26.4 41.4 28.3C43.6 28.9 45.2 29 46.8 27.8C45.4 31.1 43.1 31.2 40.9 30.8C33.9 29.6 26.8 32 21.4 37.5Z"/>
  <path class="dark" d="M80.4 30.1C76.1 23.8 66.8 21.9 59.3 25.3C57.2 26.2 55.7 26.6 53.9 25.7C55.9 28.7 58.2 28.5 60.3 27.6C67 25 74.2 25.9 80.4 30.1Z"/>
  <!-- Almond eyes, round at their outer ends and drawn to a point toward the nose -->
  <path class="dark" d="M47.6 44.6C42.6 39.1 36.6 37 31 37.6C26.5 38.1 23.6 41.1 24.5 44.2C25.5 47.5 30.3 48.8 35.8 48C40.2 47.4 44.3 46.2 47.6 44.6Z"/>
  <path class="dark" d="M56.3 43C59.9 36.7 65.1 33.4 70.6 32.9C75.2 32.4 78.5 34.6 78.3 37.8C78.2 41.2 73.8 43.6 68.4 44.1C63.8 44.5 59.7 44.1 56.3 43Z"/>
  <!-- The nose, a small upturned curve -->
  <path class="dark" d="M46.9 56C47.7 56.7 48 57.5 48.2 57.8C51.2 60.6 55.8 60.3 58.1 56C58.2 55.4 58.5 54.8 59.2 54.3C58.3 58.1 55.5 61.1 52.2 60.6C50 60.3 48.1 59 46.9 56Z"/>
  <!-- A wide, open grin, its corners turned up -->
  <path class="dark" d="M32.8 63.5C34.5 65.2 35.9 65.9 37.5 66.2C46 67.8 62.2 66 69.7 62.3C71.4 61.6 72.6 60.5 74 58.4C73.6 60.6 73.4 61.9 73 63.7C71.2 72.4 64.7 80.6 55.7 81.7C46.6 82.6 38.9 76.2 35.2 68.3C34.5 66.6 33.8 65.3 32.8 63.5Z"/>
  <!-- A glint on the upper lip, on the side the light comes from -->
  <path class="light" stroke-width="0.8" d="M38.2 68.7C42.6 70.2 48.6 70.2 54.6 69.2C48.8 71.1 43.3 71.8 39.1 70.4C38.5 70 38.1 69.5 38.2 68.7Z"/>
  <!-- Gouges down the shadowed side of the mask, following its curve -->
  <path class="dark" d="M81.4 12.8C85.9 25.1 86.6 39.3 83.8 53.1C82.1 61.4 78.7 68.9 74.6 75.5C77.2 67.9 79.8 60.3 81.4 52C83.3 40.2 83.1 26.2 81.4 12.8Z"/>
  <path class="dark" d="M77.8 49.1C78.7 54.2 77.1 59 73.5 62.9C74.9 58.3 76.2 53.9 77.8 49.1Z"/>
  <!-- A crease under the chin -->
  <path class="dark" d="M47.2 89C53.3 91.3 60.3 90.3 65.5 86.1C61 91.6 52.9 93 47.2 89Z"/>
</svg>
