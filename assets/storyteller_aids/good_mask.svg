<!-- A smiling comedy mask with its eyes closed, for the good team -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    /* How the picture looks on a card, for viewing this file on its own.
       On a card, each shape is painted from the card's own color instead. */
    svg { background: #29616f; }
    path { fill: #9ec3cd; stroke: #cbe0e6; stroke-linecap: round; stroke-linejoin: round; }
    path:not([stroke-width]) { stroke-width: 0.6; }
    .dark { fill: #29616f; stroke: none; }
    .line { fill: none; stroke: #9ec3cd; }
    .line:not([stroke-width]) { stroke-width: 1.5; }
    .dark.line { stroke: #29616f; }
  </style>

  <!-- The face -->
  <path class="light" d="M14 14C30 8 40 16 50 14C60 16 70 8 86 14C92 34 88 56 74 76C66 88 58 94 50 94C42 94 34 88 26 76C12 56 8 34 14 14Z"/>
  <!-- Closed, smiling eyes -->
  <path class="dark" d="M21 40C25 31 39 31 44 39C38 35.5 27 35.5 21 40Z"/>
  <path class="dark" d="M79 40C75 31 61 31 56 39C62 35.5 73 35.5 79 40Z"/>
  <!-- Raised brows -->
  <path class="dark line" stroke-width="1.2" d="M20 27Q32 21 43 27"/>
  <path class="dark line" stroke-width="1.2" d="M80 27Q68 21 57 27"/>
  <!-- The nose and the smile lines either side of it -->
  <path class="dark line" d="M46 54Q50 58 54 54"/>
  <path class="dark line" d="M31 49Q24 55 25 61"/>
  <path class="dark line" d="M69 49Q76 55 75 61"/>
  <!-- A wide grin, with the top teeth showing -->
  <path class="dark" d="M24 60C36 66 64 66 76 60C72 78 62 86 50 86C38 86 28 78 24 60Z"/>
  <path class="light" d="M29 63.5C40 68 60 68 71 63.5C69 67 63 70.5 50 71C37 70.5 31 67 29 63.5Z"/>
</svg>
