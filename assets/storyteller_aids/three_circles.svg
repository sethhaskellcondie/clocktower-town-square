<!-- Three ringed medallions heaped together, for the three characters the demon is shown that are not in play -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    /* How the picture looks on a card, for viewing this file on its own.
       On a card, each shape is painted from the card's own color instead. */
    svg { background: #29616f; }
    path { fill: #9ec3cd; stroke: #cbe0e6; stroke-linecap: round; stroke-linejoin: round; }
    path:not([stroke-width]) { stroke-width: 0.6; }
    .dark { fill: #29616f; stroke: none; }
    .line { fill: none; stroke: #9ec3cd; }
    .line:not([stroke-width]) { stroke-width: 1.5; }
    .dark.line { stroke: #29616f; }
  </style>

  <!-- Each medallion is a broad outer ring, a middling ring and a thin ring round the open centre -->
  <!-- Each ring is cut as a band, its inside traced the other way round to leave a hole -->

  <!-- The top medallion -->
  <path class="light" stroke-width="2" d="M28 27A22 22 0 1 0 72 27A22 22 0 1 0 28 27ZM32.4 27A17.6 17.6 0 1 1 67.6 27A17.6 17.6 0 1 1 32.4 27Z"/>
  <path class="light" stroke-width="2" d="M38.6 27A11.4 11.4 0 1 0 61.4 27A11.4 11.4 0 1 0 38.6 27ZM41.2 27A8.8 8.8 0 1 1 58.8 27A8.8 8.8 0 1 1 41.2 27Z"/>
  <path class="light" stroke-width="2" d="M45.2 27A4.8 4.8 0 1 0 54.8 27A4.8 4.8 0 1 0 45.2 27ZM46.5 27A3.5 3.5 0 1 1 53.5 27A3.5 3.5 0 1 1 46.5 27Z"/>

  <!-- The medallion at the lower left, a little larger -->
  <path class="light" stroke-width="2" d="M3 71A23 23 0 1 0 49 71A23 23 0 1 0 3 71ZM7.6 71A18.4 18.4 0 1 1 44.4 71A18.4 18.4 0 1 1 7.6 71Z"/>
  <path class="light" stroke-width="2" d="M14 71A12 12 0 1 0 38 71A12 12 0 1 0 14 71ZM16.8 71A9.2 9.2 0 1 1 35.2 71A9.2 9.2 0 1 1 16.8 71Z"/>
  <path class="light" stroke-width="2" d="M20.9 71A5.1 5.1 0 1 0 31.1 71A5.1 5.1 0 1 0 20.9 71ZM22.3 71A3.7 3.7 0 1 1 29.7 71A3.7 3.7 0 1 1 22.3 71Z"/>

  <!-- The medallion at the lower right, a little smaller -->
  <path class="light" stroke-width="2" d="M53 73A21 21 0 1 0 95 73A21 21 0 1 0 53 73ZM57.2 73A16.8 16.8 0 1 1 90.8 73A16.8 16.8 0 1 1 57.2 73Z"/>
  <path class="light" stroke-width="2" d="M63.1 73A10.9 10.9 0 1 0 84.9 73A10.9 10.9 0 1 0 63.1 73ZM65.6 73A8.4 8.4 0 1 1 82.4 73A8.4 8.4 0 1 1 65.6 73Z"/>
  <path class="light" stroke-width="2" d="M69.4 73A4.6 4.6 0 1 0 78.6 73A4.6 4.6 0 1 0 69.4 73ZM70.6 73A3.4 3.4 0 1 1 77.4 73A3.4 3.4 0 1 1 70.6 73Z"/>
</svg>
