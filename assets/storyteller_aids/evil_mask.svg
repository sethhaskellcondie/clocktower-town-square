<!-- A horned mask with a scowl and a fanged grin, tipped the other way to the good mask, for the evil team -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    /* How the picture looks on a card, for viewing this file on its own.
       On a card, each shape is painted from the card's own color instead. */
    svg { background: #29616f; }
    path { fill: #9ec3cd; stroke: #cbe0e6; stroke-linecap: round; stroke-linejoin: round; }
    path:not([stroke-width]) { stroke-width: 0.6; }
    .dark { fill: #29616f; stroke: none; }
    .line { fill: none; stroke: #9ec3cd; }
    .line:not([stroke-width]) { stroke-width: 1.5; }
    .dark.line { stroke: #29616f; }
  </style>

  <!-- The mask, its raised corners grown into horns and its sides drawn to a point at the chin -->
  <path class="light" stroke-width="2" d="M13.6 34.3C11.9 29.8 9.8 24.8 9.2 19.7C8.6 14.7 9.6 9.4 12.3 4.5C13.7 10.6 16.5 16.1 20.4 20.6C22.1 22.4 23.8 24.1 25.5 25.7C32.4 30.2 40.2 33.2 48.5 34.4C57.1 35 65.3 33.2 72.5 29.9C74.4 29 76.4 27.7 78.4 26.1C83.3 22.3 87.1 17.7 89.9 11.9C91.4 17.8 91.1 23.5 89.5 28.6C88.1 33 85.4 37.2 82.3 40.8C82.8 51.4 79.9 62 73.7 71.4C67.5 80.9 58.4 89.4 47.8 93.9C45.6 94.7 43.7 95.3 42.2 95.5C40.4 94.9 38.5 93.8 36.6 92.5C26.8 85.5 19.7 75.3 15.6 64.5C11.7 53.9 11.2 43.5 13.6 34.3Z"/>
  <!-- A groove up the inside of each horn -->
  <path class="dark" d="M13.1 11.3C11.9 16.9 13.8 22.4 18.3 26.8C16 22.3 14.5 17.3 13.1 11.3Z"/>
  <path class="dark" d="M88 18.4C87.7 24.3 84.4 29.3 78.7 32.6C82.4 28.9 85.3 24.2 88 18.4Z"/>
  <!-- Brows drawn down into a scowl, heavy where they meet over the nose -->
  <path class="dark" d="M19.6 37.7C26.9 38.5 35.8 42 43.1 47C44.3 47.9 43.9 49.9 42.2 50.1C34.5 47.2 26.6 43.3 19.6 37.7Z"/>
  <path class="dark" d="M75.7 42.9C68.4 42.3 58.9 44.1 51 47.7C49.6 48.3 49.6 50.3 51.2 50.7C59.3 49.3 67.9 46.9 75.7 42.9Z"/>
  <!-- Narrow, slanted eyes, pointed at both ends -->
  <path class="dark" d="M22.4 44.7C27.7 46.9 34.8 49.7 41.2 52.8C37.7 55.4 33.2 55.8 29.1 54.5C25.4 53.1 23.1 49.6 22.4 44.7Z"/>
  <path class="dark" d="M71.8 49.1C66.1 50.4 58.5 51.8 51.6 53.5C54.5 56.7 58.8 58.1 63.1 57.7C67 57.1 69.9 53.9 71.8 49.1Z"/>
  <!-- A hooked nose -->
  <path class="dark" d="M40.1 64.7C42.6 62 47.4 62.3 49.8 65.3C47.4 64.2 42.8 63.9 40.1 64.7Z"/>
  <!-- A sly grin, its corners drawn up the cheeks -->
  <path class="dark" d="M19.4 58.3C26 66.5 35.7 70.9 44.5 71.8C53.3 72.6 63.4 69.9 71.6 62.8C68.3 73.4 57.9 83.8 43.5 83.2C29.3 81 21 69.5 19.4 58.3Z"/>
  <!-- Two fangs hanging from the top lip, the left one a little longer -->
  <path class="light" d="M31 68.4C32 71.1 33 74 34 77C34.8 74.5 35.8 72.2 36.7 70.1Z"/>
  <path class="light" d="M52.7 71.9C53.4 74.1 53.9 76.2 54.2 78.4C55.6 76.1 56.9 73.7 58.3 71.4Z"/>
  <!-- Gouges down the shadowed side of the mask, following its curve -->
  <path class="dark" d="M80.1 43.5C80.4 54.7 76.9 65.4 70.4 74.4C67.1 78.8 63 82.9 58.6 86.1C62.4 82 65.8 77.8 68.7 73.3C74.4 64 77.9 54 80.1 43.5Z"/>
</svg>
