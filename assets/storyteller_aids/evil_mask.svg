<!-- A horned mask with a sly, fanged grin, for the evil team -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    /* How the picture looks on a card, for viewing this file on its own.
       On a card, each shape is painted from the card's own color instead. */
    svg { background: #29616f; }
    path { fill: #9ec3cd; stroke: #cbe0e6; stroke-linecap: round; stroke-linejoin: round; }
    path:not([stroke-width]) { stroke-width: 0.6; }
    .dark { fill: #29616f; stroke: none; }
    .line { fill: none; stroke: #9ec3cd; }
    .line:not([stroke-width]) { stroke-width: 1.5; }
    .dark.line { stroke: #29616f; }
  </style>

  <!-- The horns, curling up from the brow -->
  <path class="light" d="M22 28C10 27 3 18 7 9C8 6 12 5 14 7C11 13 15 20 34 24Z"/>
  <path class="light" d="M78 28C90 27 97 18 93 9C92 6 88 5 86 7C89 13 85 20 66 24Z"/>
  <!-- The face, tapering to a point at the chin -->
  <path class="light" d="M16 25C32 21 42 28 50 26C58 28 68 21 84 25C92 45 88 65 70 83C62 90 56 93 50 95C44 93 38 90 30 83C12 65 8 45 16 25Z"/>
  <!-- Brows drawn down into a scowl over closed, smug eyes -->
  <path class="dark line" stroke-width="1.4" d="M22 36L42 42"/>
  <path class="dark line" stroke-width="1.4" d="M78 36L58 42"/>
  <path class="dark" d="M24 46C28 41 38 42 44 49C38 46 30 45 24 46Z"/>
  <path class="dark" d="M76 46C72 41 62 42 56 49C62 46 70 45 76 46Z"/>
  <!-- The nose -->
  <path class="dark line" d="M46 57Q50 60 54 57"/>
  <!-- A grin from ear to ear, its top teeth showing and two of them fangs -->
  <path class="dark" d="M24 61C36 69 64 69 76 61C72 77 62 86 50 86C38 86 28 77 24 61Z"/>
  <path class="light" d="M29 64.5C40 70 60 70 71 64.5C69 68.5 62 72 50 72.5C38 72 31 68.5 29 64.5Z"/>
  <path class="light" d="M35.5 70.5L39 78L42.5 71.8Z"/>
  <path class="light" d="M64.5 70.5L61 78L57.5 71.8Z"/>
</svg>
