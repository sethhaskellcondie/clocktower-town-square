<!-- A bold X, cut in two broad strokes, for asking a player to choose again -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    /* How the picture looks on a card, for viewing this file on its own.
       On a card, each shape is painted from the card's own color instead. */
    svg { background: #29616f; }
    path { fill: #9ec3cd; stroke: #cbe0e6; stroke-linecap: round; stroke-linejoin: round; }
    path:not([stroke-width]) { stroke-width: 0.6; }
    .dark { fill: #29616f; stroke: none; }
    .line { fill: none; stroke: #9ec3cd; }
    .line:not([stroke-width]) { stroke-width: 1.5; }
    .dark.line { stroke: #29616f; }
  </style>

