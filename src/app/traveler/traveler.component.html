<div
  class="traveler-circle"
  [class.alive]="state === 'alive'"
  [class.marked-for-death]="state === 'marked for death'"
  [class.killed-during-night]="state === 'killed during the night'"
  [class.dead-with-vote]="state === 'dead with vote'"
  [class.dead-without-vote]="state === 'dead without vote'"
  [class.highlighted]="isHighlighted"
  [class.winner]="isWinner"
  [class.size-small]="size === 'small'"
  [class.size-medium]="size === 'medium'"
  [class.size-large]="size === 'large'"
  [class.texture-1]="texture === 1"
  [class.texture-2]="texture === 2"
  [class.texture-3]="texture === 3"
  [class.texture-4]="texture === 4"
  [style.left.px]="positionX"
  [style.top.px]="positionY"
  (mousedown)="onMouseDown($event)"
  (contextmenu)="onRightClick($event)"
>
  @if (isEditing) {
    <textarea
      #nameInput
      class="name-input"
      [(ngModel)]="name"
      (blur)="stopEditing()"
      (keydown)="onNameKeydown($event)"
    ></textarea>
  } @else {
    <span class="name-display">{{ name }}</span>
  }
</div>

<!-- The traveler's character icon sits just right of the circle, outside it
     since the circle clips its contents. Buttons that act while editing keep
     the name input focused on mousedown, so its blur doesn't end editing
     before their click lands. -->
@if (character || isEditing) {
  <div
    class="traveler-aside"
    [class.size-small]="size === 'small'"
    [class.size-medium]="size === 'medium'"
    [class.size-large]="size === 'large'"
    [class.picking]="isPickingCharacter"
    [style.left.px]="positionX + diameter"
    [style.top.px]="positionY + diameter / 2"
  >
    @if (character) {
      <div class="character">
        <button
          class="character-icon"
          [id]="'traveler_' + number + '_character'"
          [class.editing]="isEditing"
          (click)="onCharacterClick()"
          [attr.aria-label]="'Open the ' + character.name + ' player aid'"
          [title]="character.name"
        >
          <img [src]="character.icon" [alt]="character.name" draggable="false">
        </button>
        @if (isEditing) {
          <button
            class="character-remove"
            [id]="'traveler_' + number + '_character_remove'"
            (mousedown)="$event.preventDefault()"
            (click)="removeCharacter()"
            [attr.aria-label]="'Remove the ' + character.name + ' icon'"
          >&times;</button>
        }
      </div>
    } @else {
      <button
        class="character-add"
        [id]="'traveler_' + number + '_character_add'"
        [class.active]="isPickingCharacter"
        (mousedown)="$event.preventDefault()"
        (click)="togglePicker()"
        [attr.aria-expanded]="isPickingCharacter"
        aria-label="Add a traveler icon"
      >+</button>
      @if (isPickingCharacter) {
        <div class="character-picker" role="menu">
          @for (option of characters; track option.id) {
            <button
              class="character-option"
              role="menuitem"
              [id]="'traveler_' + number + '_character_' + option.id"
              (mousedown)="$event.preventDefault()"
              (click)="chooseCharacter(option)"
              [title]="option.name"
            >
              <img [src]="option.icon" [alt]="option.name" draggable="false">
            </button>
          }
        </div>
      }
    }
  </div>
}
