<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1320 560" width="1320" height="560">
  <defs>
    <!-- The figure: one goblet, its silhouette only, centred on (0,0) and
         drawn at the size it's shown. Replace it with your own. Parts that
         sit 4 to 8 apart are joined by a cream gap where the outline fills
         the space between them. -->
    <g id="figure">
      <path d="M-58,-128 Q0,-140 58,-128 Q64,-62 26,-30 Q10,-20 8,-8 L7,34 Q8,46 36,56 Q54,64 50,74 Q0,86 -50,74 Q-54,64 -36,56 Q-8,46 -7,34 L-8,-8 Q-10,-20 -26,-30 Q-64,-62 -58,-128Z"/>
    </g>
    <!-- The cream laid over the paint: the rim, a band round the stem, and
         glints tapering to points down the lit side and across the foot. -->
    <g id="figure-cream" fill="#efe6d6">
      <path d="M-54,-124 Q0,-134 54,-124 Q0,-110 -54,-124Z"/>
      <path d="M-42,-106 Q-46,-68 -18,-40 Q-36,-72 -32,-104Z"/>
      <path d="M40,-100 Q42,-80 34,-62 Q38,-82 36,-98Z"/>
      <path d="M-12,2 L12,2 L11,10 L-11,10Z"/>
      <path d="M-32,64 Q0,70 34,64 Q0,76 -32,64Z"/>
    </g>

    <!-- The kit: the same filters in every picture, so they all match the
         character icons. Delete the paints you don't use. -->

    <!-- Cream outline with a soft glow, like the character icons. -->
    <filter id="outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="4" result="grown"/>
      <feFlood flood-color="#efe6d6"/>
      <feComposite in2="grown" operator="in" result="edge"/>
      <feGaussianBlur in="grown" stdDeviation="9" result="blur"/>
      <feFlood flood-color="#efe6d6" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="edge"/></feMerge>
    </filter>

    <!-- Edges cut by hand: nudges everything it's put on by a pixel or two. -->
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="2"/>
      <feDisplacementMap in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- Mottled paint, clipped to the shape it's put on: broad blotches with
         a fine grain through them, mapped onto one team's colors from dark
         to light. Worked out in sRGB, so the colors come out as written. -->
    <filter id="paint-good" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="4" seed="9" result="blotch"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="2" seed="3" result="grain"/>
      <feComposite in="blotch" in2="grain" operator="arithmetic" k2="0.8" k3="0.35" k4="-0.075"/>
      <feColorMatrix type="matrix" values="3 0 0 0 -1  3 0 0 0 -1  3 0 0 0 -1  0 0 0 0 1"/>
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0.00 0.00 0.01 0.00 0.00"/>
        <feFuncG type="table" tableValues="0.27 0.40 0.48 0.57 0.71"/>
        <feFuncB type="table" tableValues="0.61 0.68 0.72 0.77 0.85"/>
      </feComponentTransfer>
      <feComposite in2="SourceAlpha" operator="in"/>
    </filter>
    <filter id="paint-evil" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="4" seed="9" result="blotch"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="2" seed="3" result="grain"/>
      <feComposite in="blotch" in2="grain" operator="arithmetic" k2="0.8" k3="0.35" k4="-0.075"/>
      <feColorMatrix type="matrix" values="3 0 0 0 -1  3 0 0 0 -1  3 0 0 0 -1  0 0 0 0 1"/>
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0.27 0.42 0.53 0.62 0.72"/>
        <feFuncG type="table" tableValues="0.02 0.04 0.05 0.06 0.13"/>
        <feFuncB type="table" tableValues="0.03 0.05 0.07 0.08 0.15"/>
      </feComponentTransfer>
      <feComposite in2="SourceAlpha" operator="in"/>
    </filter>
    <filter id="paint-fabled" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="4" seed="9" result="blotch"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="2" seed="3" result="grain"/>
      <feComposite in="blotch" in2="grain" operator="arithmetic" k2="0.8" k3="0.35" k4="-0.075"/>
      <feColorMatrix type="matrix" values="3 0 0 0 -1  3 0 0 0 -1  3 0 0 0 -1  0 0 0 0 1"/>
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0.48 0.61 0.69 0.79 0.86"/>
        <feFuncG type="table" tableValues="0.16 0.27 0.39 0.54 0.69"/>
        <feFuncB type="table" tableValues="0.00 0.00 0.00 0.00 0.13"/>
      </feComponentTransfer>
      <feComposite in2="SourceAlpha" operator="in"/>
    </filter>
    <filter id="paint-loric" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="4" seed="9" result="blotch"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="2" seed="3" result="grain"/>
      <feComposite in="blotch" in2="grain" operator="arithmetic" k2="0.8" k3="0.35" k4="-0.075"/>
      <feColorMatrix type="matrix" values="3 0 0 0 -1  3 0 0 0 -1  3 0 0 0 -1  0 0 0 0 1"/>
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0.18 0.31 0.40 0.53 0.66"/>
        <feFuncG type="table" tableValues="0.24 0.38 0.50 0.64 0.75"/>
        <feFuncB type="table" tableValues="0.16 0.24 0.25 0.23 0.29"/>
      </feComponentTransfer>
      <feComposite in2="SourceAlpha" operator="in"/>
    </filter>
    <filter id="paint-neutral" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="4" seed="9" result="blotch"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="2" seed="3" result="grain"/>
      <feComposite in="blotch" in2="grain" operator="arithmetic" k2="0.8" k3="0.35" k4="-0.075"/>
      <feColorMatrix type="matrix" values="3 0 0 0 -1  3 0 0 0 -1  3 0 0 0 -1  0 0 0 0 1"/>
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0.23 0.33 0.43 0.55 0.65"/>
        <feFuncG type="table" tableValues="0.20 0.29 0.39 0.51 0.61"/>
        <feFuncB type="table" tableValues="0.33 0.44 0.56 0.68 0.74"/>
      </feComponentTransfer>
      <feComposite in2="SourceAlpha" operator="in"/>
    </filter>
  </defs>

  <!-- The panel: a dark card with a rounded border and a title, both in the
       accent color. -->
  <rect width="1320" height="560" fill="#261f45"/>
  <rect x="41.5" y="41.5" width="1237" height="477" rx="26" fill="#14101e" stroke="#3f8fd6" stroke-width="3"/>
  <text x="660" y="122" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-weight="bold" font-size="58" fill="#3f8fd6">TITLE</text>

  <!-- The figure, tipped a little off straight. Outline first, the paint
       over it, then the cream, all roughened together. -->
  <g transform="translate(660 330) rotate(-5)" filter="url(#rough)">
    <use xlink:href="#figure" filter="url(#outline)"/>
    <use xlink:href="#figure" filter="url(#paint-good)"/>
    <use xlink:href="#figure-cream"/>
  </g>
</svg>
