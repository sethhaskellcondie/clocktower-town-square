<!-- A goblet, an example of a storyteller aid picture in the project's style -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    /* How the picture looks on a card, for viewing this file on its own.
       On a card, each shape is painted from the card's own color instead. */
    svg { background: #29616f; }
    path { fill: #9ec3cd; stroke: #cbe0e6; stroke-linecap: round; stroke-linejoin: round; }
    path:not([stroke-width]) { stroke-width: 0.6; }
    .dark { fill: #29616f; stroke: none; }
    .line { fill: none; stroke: #9ec3cd; }
    .line:not([stroke-width]) { stroke-width: 1.5; }
    .dark.line { stroke: #29616f; }
  </style>

  <!-- The goblet, tipped a little, its edge cut by hand, with a broad pale rim -->
  <path class="light" stroke-width="2" d="M22.2 13.2C33.7 8.9 49.2 6.9 61.6 7.2L72.2 8.3C74.9 23.6 72.3 37.9 61.7 47.4C57.5 51 55 54.1 55 58L55.8 74.5C56.9 77.6 62.9 79.6 68.2 82C72.1 83.6 73.2 85.7 71.5 88.2C59.7 92.4 43.2 93.6 30.9 90.9C29.6 88.5 31.2 86.1 35.1 83.8C40.3 81 45.5 78.2 45.9 75L44.6 58.9C43.8 54.9 40.7 52.2 36 49C25.6 41.8 21.3 27.8 22.2 13.2Z"/>
  <!-- The mouth of the cup, open, and the knot on the stem -->
  <path class="dark" d="M25.1 15.4C38.3 11.7 56.2 10.3 69.8 11.6C56.6 16.5 38.8 18 25.1 15.4Z"/>
  <path class="dark" d="M43.7 63L55.8 61.9L55.7 64.6L44.1 65.7Z"/>
  <!-- Gouges down the shadowed side of the cup and stem, tapering to points -->
  <path class="dark" d="M66.5 19.7C67.8 29 65.1 37.5 58.8 44C62.9 36.1 64.9 28.3 64.3 20.3Z"/>
  <path class="dark" d="M60.5 24.1C61 30.1 59.5 34.7 56.4 38.6C57.9 34.2 58.4 29.4 58.8 24.5Z"/>
  <path class="dark" d="M53.7 67.3L53.9 74L52.1 67.8Z"/>
  <!-- A crease along the foot -->
  <path class="dark" d="M34.3 88.2C46.1 90.2 59.5 89.3 69.8 85.9C59.6 91.1 45.1 92.1 34.3 88.2Z"/>
  <!-- A glint, pale on the dark mouth of the cup -->
  <path class="light" stroke-width="0.8" d="M31.8 14.9C38.5 13.5 45.2 12.8 51.9 12.6C45.2 14.2 38.6 15.1 31.8 14.9Z"/>
</svg>
